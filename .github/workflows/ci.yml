name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      NO_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development and optional dependencies
        run: uv sync --locked --all-extras --group dev

      - name: Lint
        run: uv run --offline --no-sync ruff check .

      - name: Check formatting
        run: uv run --offline --no-sync ruff format --check .

      - name: Check types
        run: uv run --offline --no-sync pyright

      - name: Set up R for required interoperability checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.2'
          use-public-rspm: false

      - name: Install pinned jsonlite for R interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: Rscript --vanilla {0}
        run: |
          # CRAN jsonlite 2.0.0 source, pinned to its immutable mirror commit.
          # Runtime dependencies are base R's methods; no fitting packages.
          utils::install.packages(
            "https://github.com/cran/jsonlite/archive/2559608891cc42b9f857a5a0aff231738a670576.tar.gz",
            repos = NULL, type = "source", dependencies = FALSE
          )
          stopifnot(requireNamespace("jsonlite", quietly = TRUE))
          stopifnot(as.character(utils::packageVersion("jsonlite")) == "2.0.0")

      - name: Run offline tests with coverage
        run: uv run --offline --no-sync pytest

      - name: Verify required Python-to-R interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: bash
        env:
          JUDGMENTLLM_R_STRICT: '1'
        run: |
          set -euo pipefail
          uv run --offline --no-sync python examples/export_r.py --output "$RUNNER_TEMP/judgmentllm-r"
          Rscript --vanilla examples/r_interoperability.R "$RUNNER_TEMP/judgmentllm-r"

      - name: Verify required persistence-to-R interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: bash
        env:
          JUDGMENTLLM_R_STRICT: '1'
        run: |
          set -euo pipefail
          uv run --offline --no-sync python scripts/persistence_r_fixture.py --phase persist --output "$RUNNER_TEMP/judgmentllm-persistence-r"
          uv run --offline --no-sync python scripts/persistence_r_fixture.py --phase export --output "$RUNNER_TEMP/judgmentllm-persistence-r"
          Rscript --vanilla examples/persistence_interoperability.R "$RUNNER_TEMP/judgmentllm-persistence-r"

      - name: Build distributions
        run: uv build --offline

      - name: Validate distribution metadata
        run: uv run --offline --no-sync twine check --strict dist/*

      - name: Verify clean core wheel installation
        run: uv run --offline --no-sync python scripts/smoke_install.py dist/*.whl

      - name: Verify clean core source distribution installation
        if: runner.os == 'Linux'
        run: uv run --offline --no-sync python scripts/smoke_install.py dist/*.tar.gz

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Preserve distributions
        if: runner.os == 'Linux' && matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload coverage to Codecov when connected
        if: runner.os == 'Linux' && matrix.python == '3.11' && vars.CODECOV_ENABLED == 'true'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
