name: CI

on:
  # The workflow and policy come from the protected base, not the proposed PR.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      risk:
        description: Minimum verification level (4 = comprehensive; never lowers classification)
        type: choice
        options: ['4', '3', '2', '1', '0']
        default: '4'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || (github.event_name == 'workflow_dispatch' && 'refs/remotes/origin/main') || github.sha }}
  RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
  PURPOSE: ${{ github.event_name == 'push' && 'main-linux' || 'pr' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      risk: ${{ steps.plan.outputs.risk }}
      packaging: ${{ steps.plan.outputs.packaging }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Classify using trusted policy
        id: plan
        env:
          MINIMUM: ${{ github.event_name == 'schedule' && '4' || inputs.risk || '0' }}
        run: python policy/ci/acceptance.py plan --source candidate --base "$BASE_REF" --head "$SOURCE_SHA" --risk "$MINIMUM" --purpose "$PURPOSE" --output "$RUNNER_TEMP/p/plan.json"
      - name: Prepare locked environment
        if: steps.plan.outputs.risk != '0'
        run: uv sync --project candidate --locked --all-extras --group dev
      - name: Inexpensive checks before the matrix
        env:
          RISK: ${{ steps.plan.outputs.risk }}
        shell: bash
        run: |
          launcher=(python)
          if [ "$RISK" != 0 ]; then launcher=(uv run --project candidate --offline --no-sync python); fi
          "${launcher[@]}" policy/ci/acceptance.py lane --source candidate --plan "$RUNNER_TEMP/p/plan.json" --run-id "$RUN_ID" --execution-scope hosted --quality-only --output "$RUNNER_TEMP/p/quality"
      - name: Preserve plan and quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-plan
          path: |
            ${{ runner.temp }}/p/plan.json
            ${{ runner.temp }}/p/quality/*.json
            ${{ runner.temp }}/p/quality/*.log
          if-no-files-found: error

  verify:
    needs: plan
    name: ${{ matrix.id }} (${{ matrix.profile }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (matrix.id == 'windows-3.11' || matrix.id == 'windows-3.12') && matrix.profile == 'full' && matrix.partition == 'ordinary' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Seed Windows ordinary summary
        if: (matrix.id == 'windows-3.11' || matrix.id == 'windows-3.12') && matrix.partition == 'ordinary'
        shell: pwsh
        run: |
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Windows ordinary: full suite unexecuted/incomplete; completion not verified.`n")
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        if: needs.plan.outputs.risk != '0'
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verification-plan
          path: ${{ runner.temp }}/p
      - name: Prepare locked environment
        if: needs.plan.outputs.risk != '0'
        run: uv sync --project candidate --locked --all-extras --group dev
      - name: Early offline Windows smoke
        id: windows_smoke
        if: (matrix.id == 'windows-3.11' || matrix.id == 'windows-3.12') && matrix.partition == 'ordinary'
        timeout-minutes: 6
        shell: pwsh
        env:
          LANE_ID: ${{ matrix.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = $env:GITHUB_STEP_SUMMARY
          $code = 1
          try {
            $source = (Resolve-Path -LiteralPath candidate).Path
            $python = Join-Path $source '.venv/Scripts/python.exe'
            $helper = (Resolve-Path -LiteralPath 'policy/ci/windows_smoke.py').Path
            $arguments = @('run', '--source', $source,
              '--output', (Join-Path $env:RUNNER_TEMP 'windows-smoke'),
              '--plan', (Join-Path $env:RUNNER_TEMP 'p/plan.json'),
              '--head', $env:SOURCE_SHA, '--lane', $env:LANE_ID,
              '--run-id', $env:RUN_ID, '--summary', $summary)
            $clean = @{}
            foreach ($key in @('PATH','SystemRoot','WINDIR','TEMP','TMP','HOME','LANG','LC_ALL')) {
              $value = [Environment]::GetEnvironmentVariable($key)
              if ($null -ne $value) { $clean[$key] = $value }
            }
            foreach ($entry in @(Get-ChildItem Env:)) { [Environment]::SetEnvironmentVariable($entry.Name, $null) }
            foreach ($key in $clean.Keys) { [Environment]::SetEnvironmentVariable($key, $clean[$key]) }
            $env:PYTHONDONTWRITEBYTECODE = '1'
            $env:PYTHONUTF8 = '1'
            $env:UV_OFFLINE = '1'
            $env:UV_PYTHON_DOWNLOADS = 'never'
            & $python -I $helper @arguments
            $code = $LASTEXITCODE
          } catch {
            [IO.File]::AppendAllText($summary, "Windows ordinary diagnostics unavailable or invalid. Full suite: unexecuted/incomplete; completion not verified.`n")
          }
          exit $code
      - name: Prepare offline core installation cache
        if: needs.plan.outputs.packaging == 'true' && matrix.partition != 'serial' && (matrix.id == 'linux-3.11' || needs.plan.outputs.risk == '4')
        shell: bash
        run: |
          uv export --project candidate --locked --no-default-groups --no-emit-project --output-file "$RUNNER_TEMP/core-requirements.txt"
          uv pip install --python candidate/.venv --target "$RUNNER_TEMP/core-dependencies" --require-hashes --requirements "$RUNNER_TEMP/core-requirements.txt"
      - name: Execute planned checks
        id: planned_checks
        shell: bash
        env:
          RISK: ${{ needs.plan.outputs.risk }}
        run: |
          launcher=(python)
          if [ "$RISK" != 0 ]; then launcher=(uv run --project candidate --offline --no-sync python); fi
          partition=()
          if [ -n "${{ matrix.partition }}" ]; then partition=(--partition "${{ matrix.partition }}"); fi
          "${launcher[@]}" policy/ci/acceptance.py lane \
            --source candidate --plan "$RUNNER_TEMP/p/plan.json" --lane "${{ matrix.id }}" \
            --execution-scope hosted "${partition[@]}" \
            --quality-receipt "$RUNNER_TEMP/p/quality/quality.json" --run-id "$RUN_ID" --output "$RUNNER_TEMP/v"
      - name: Preserve diagnostics even on failure
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.id }}-${{ matrix.partition || 'all' }}
          path: |
            ${{ runner.temp }}/v/*.json
            ${{ runner.temp }}/v/*.log
            ${{ runner.temp }}/v/suite/*.json
            ${{ runner.temp }}/v/suite/*.log
            ${{ runner.temp }}/v/suite/*.xml
            ${{ runner.temp }}/v/suite/resource-measurements/*.json
            ${{ runner.temp }}/v/openai-resources/*.json
            ${{ runner.temp }}/windows-smoke/status.json
            ${{ runner.temp }}/windows-smoke/cases.json
            ${{ runner.temp }}/windows-smoke/smoke.log
          if-no-files-found: error
      - name: Summarize Windows ordinary diagnostics
        if: always() && (matrix.id == 'windows-3.11' || matrix.id == 'windows-3.12') && matrix.partition == 'ordinary'
        shell: pwsh
        env:
          LANE_ID: ${{ matrix.id }}
          CHECKS_OUTCOME: ${{ steps.planned_checks.outcome }}
          UPLOAD_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          try {
            $ErrorActionPreference = 'Stop'
            $summary = $env:GITHUB_STEP_SUMMARY
            $source = Join-Path $env:GITHUB_WORKSPACE 'candidate'
            $python = Join-Path $source '.venv/Scripts/python.exe'
            $helper = (Resolve-Path -LiteralPath 'policy/ci/windows_smoke.py').Path
            $arguments = @('summary', '--source', $source,
              '--output', (Join-Path $env:RUNNER_TEMP 'windows-smoke'),
              '--head', $env:SOURCE_SHA, '--lane', $env:LANE_ID,
              '--run-id', $env:RUN_ID, '--summary', $summary,
              '--checks', $env:CHECKS_OUTCOME, '--upload', $env:UPLOAD_OUTCOME)
            $clean = @{}
            foreach ($key in @('PATH','SystemRoot','WINDIR','TEMP','TMP','HOME','LANG','LC_ALL')) {
              $value = [Environment]::GetEnvironmentVariable($key)
              if ($null -ne $value) { $clean[$key] = $value }
            }
            foreach ($entry in @(Get-ChildItem Env:)) { [Environment]::SetEnvironmentVariable($entry.Name, $null) }
            foreach ($key in $clean.Keys) { [Environment]::SetEnvironmentVariable($key, $clean[$key]) }
            $env:PYTHONDONTWRITEBYTECODE = '1'
            $env:PYTHONUTF8 = '1'
            & $python -I $helper @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostic renderer unavailable' }
          } catch {
            try {
              [IO.File]::AppendAllText($summary, "Windows ordinary diagnostics unavailable or invalid. Full suite: unexecuted/incomplete; completion not verified.`n")
            } catch {}
          } finally {
            exit 0
          }

  acceptance:
    name: CI acceptance
    if: always()
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only this trusted, isolated job can publish the status on the literal PR
    # head. Candidate code never receives this token or runs in this job.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Read candidate Git objects without executing candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verification-plan
          path: ${{ runner.temp }}/p
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/receipts
      - name: Require every planned lane and artifact
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MINIMUM: ${{ github.event_name == 'schedule' && '4' || inputs.risk || '0' }}
        run: |
          test "$PLAN_RESULT" = success
          test "$VERIFY_RESULT" = success
          python policy/ci/acceptance.py aggregate --plan "$RUNNER_TEMP/p/plan.json" \
            --source candidate --base "$BASE_REF" --head "$SOURCE_SHA" --risk "$MINIMUM" --purpose "$PURPOSE" \
            --receipts "$RUNNER_TEMP/receipts" --run-id "$RUN_ID" --output "$RUNNER_TEMP/acceptance.json"
      - name: Preserve acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acceptance
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
      - name: Publish exact-head required status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && 'CI candidate policy' || 'CI acceptance' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$STATE" -f context="$STATUS_CONTEXT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Hosted functional verification; local acceptance required separately"
