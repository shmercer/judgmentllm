name: CI

on:
  # The workflow and policy come from the protected base, not the proposed PR.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      risk:
        description: Minimum verification level (4 = comprehensive; never lowers classification)
        type: choice
        options: ['4', '3', '2', '1', '0']
        default: '4'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      risk: ${{ steps.plan.outputs.risk }}
      r_required: ${{ steps.plan.outputs.r_required }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Classify using trusted policy
        id: plan
        env:
          MINIMUM: ${{ github.event_name == 'schedule' && '4' || inputs.risk || '0' }}
        run: python policy/ci/acceptance.py plan --source candidate --base "$BASE_SHA" --head "$SOURCE_SHA" --risk "$MINIMUM" --output "$RUNNER_TEMP/p/plan.json"
      - name: Prepare locked environment
        if: steps.plan.outputs.risk != '0'
        run: uv sync --project candidate --locked --all-extras --group dev
      - name: Inexpensive checks before the matrix
        env:
          RISK: ${{ steps.plan.outputs.risk }}
        shell: bash
        run: |
          launcher=(python)
          if [ "$RISK" != 0 ]; then launcher=(uv run --project candidate --offline --no-sync python); fi
          "${launcher[@]}" policy/ci/acceptance.py lane --source candidate --plan "$RUNNER_TEMP/p/plan.json" --run-id "$RUN_ID" --quality-only --output "$RUNNER_TEMP/p/quality"
      - name: Preserve plan and quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-plan
          path: ${{ runner.temp }}/p/
          if-no-files-found: error

  verify:
    needs: plan
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        if: needs.plan.outputs.risk != '0'
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verification-plan
          path: ${{ runner.temp }}/p
      - name: Set up required R
        if: needs.plan.outputs.r_required == 'true' && (matrix.id == 'linux-3.11' || needs.plan.outputs.risk == '4')
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.2'
          use-public-rspm: false
      - name: Install pinned jsonlite
        if: needs.plan.outputs.r_required == 'true' && (matrix.id == 'linux-3.11' || needs.plan.outputs.risk == '4')
        shell: Rscript --vanilla {0}
        run: |
          utils::install.packages(
            "https://github.com/cran/jsonlite/archive/2559608891cc42b9f857a5a0aff231738a670576.tar.gz",
            repos = NULL, type = "source", dependencies = FALSE
          )
          stopifnot(requireNamespace("jsonlite", quietly = TRUE))
          stopifnot(as.character(utils::packageVersion("jsonlite")) == "2.0.0")
      - name: Prepare locked environment
        if: needs.plan.outputs.risk != '0'
        run: uv sync --project candidate --locked --all-extras --group dev
      - name: Execute planned checks
        shell: bash
        env:
          RISK: ${{ needs.plan.outputs.risk }}
        run: |
          launcher=(python)
          if [ "$RISK" != 0 ]; then launcher=(uv run --project candidate --offline --no-sync python); fi
          "${launcher[@]}" policy/ci/acceptance.py lane \
            --source candidate --plan "$RUNNER_TEMP/p/plan.json" --lane "${{ matrix.id }}" \
            --quality-receipt "$RUNNER_TEMP/p/quality/quality.json" --run-id "$RUN_ID" --output "$RUNNER_TEMP/v"
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/v/*.json
            ${{ runner.temp }}/v/*.log
            ${{ runner.temp }}/v/suite/*.json
            ${{ runner.temp }}/v/suite/*.log
            ${{ runner.temp }}/v/suite/*.xml
            ${{ runner.temp }}/v/suite/resource-measurements/*.json
            ${{ runner.temp }}/v/openai-resources/*.json
          if-no-files-found: error

  acceptance:
    name: CI acceptance
    if: always()
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this trusted, isolated job can publish the status on the literal PR
    # head. Candidate code never receives this token or runs in this job.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Read candidate Git objects without executing candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verification-plan
          path: ${{ runner.temp }}/p
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/receipts
      - name: Require every planned lane and artifact
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MINIMUM: ${{ github.event_name == 'schedule' && '4' || inputs.risk || '0' }}
        run: |
          test "$PLAN_RESULT" = success
          test "$VERIFY_RESULT" = success
          python policy/ci/acceptance.py aggregate --plan "$RUNNER_TEMP/p/plan.json" \
            --source candidate --base "$BASE_SHA" --head "$SOURCE_SHA" --risk "$MINIMUM" \
            --receipts "$RUNNER_TEMP/receipts" --run-id "$RUN_ID" --output "$RUNNER_TEMP/acceptance.json"
      - name: Publish exact-head required status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$STATE" -f context="CI acceptance" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Risk-based verification; required lanes and evidence checked"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acceptance
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: warn
